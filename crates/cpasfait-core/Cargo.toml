[package]
name = "cpasfait-core"
description = "Model, storage and sync core for cpasfait (shared by the TUI, companion tools and future mobile app)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
age = { version = "0.12.1", features = ["ssh"] }
base64 = { version = "0.23.1", optional = true }
chacha20poly1305 = "0.11"
directories = "6.0.0"
getrandom = "0.4.3"
hmac = "0.13.0"
jiff = { version = "1.0.1", features = ["serde"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"], optional = true }
uuid = { version = "1.29.3", features = ["v4", "v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[features]
# Google Drive remote backend (HTTP client + OAuth).
gdrive = ["dep:ureq", "dep:base64"]
